{% extends "base.html" %}
{% block content %}
<div class="form-card">
<h2>Student Registration</h2>
<form method="POST">
<label>Full Name</label><input type="text" name="name" required>
<label>Roll Number</label><input type="text" name="roll_no" required>
<label>Department</label>
<select name="department" required>
<option value="">Select Department</option>
<option>Computer Engineering</option><option>Information Technology</option>
<option>Electronics Engineering</option><option>Mechanical Engineering</option>
<option>Civil Engineering</option>
</select>
<label>Email</label><input type="email" name="email" required>
<label>Password</label><input type="password" name="password" required>
<button type="submit">Register</button>
</form>
</div>
{% endblock %}
